# Magnetic's database for development: Postgres 16 with pgvector, on port 5433 so it never meets another Postgres.
# Start it with `npm run magnetic:db` from the workspace; the data stays in the `magnetic-db` volume.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: magnetic
      POSTGRES_PASSWORD: magnetic
      POSTGRES_DB: magnetic
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - magnetic-db:/var/lib/postgresql/data
      # The extensions the migrations need, made when the volume is new (the workspace's docker/initdb).
      - ../docker/initdb/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
volumes:
  magnetic-db:
