<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Magnetic</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2fd6"/>
      <stop offset="1" stop-color="#7a2fd6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- The magnet: an arch whose legs end in warm poles -->
  <path d="M166 326 V206 A90 90 0 0 1 346 206 V326" fill="none" stroke="#ffffff" stroke-width="72"/>
  <rect x="130" y="286" width="72" height="44" fill="#ff7a59"/>
  <rect x="310" y="286" width="72" height="44" fill="#ff7a59"/>
  <!-- The pull: a building block drawn up toward the poles -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.7">
    <line x1="226" y1="350" x2="226" y2="366"/>
    <line x1="256" y1="344" x2="256" y2="366"/>
    <line x1="286" y1="350" x2="286" y2="366"/>
  </g>
  <rect x="206" y="384" width="100" height="64" rx="16" fill="#ffffff"/>
  <rect x="222" y="400" width="44" height="10" rx="5" fill="#3d2fd6"/>
  <rect x="222" y="420" width="68" height="10" rx="5" fill="#7a2fd6" opacity="0.6"/>
</svg>
